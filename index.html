<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Хочу-список</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#27234a;--sky:#bfe6ff;--sun:#ffd93d;--coral:#ff7a7a;--mint:#7ee0b0;--grape:#b79cff;--paper:#fffdf6}
*{box-sizing:border-box}
html{background:var(--sky)}
body{margin:0;min-height:100vh;color:var(--ink);font:17px/1.45 Nunito,system-ui,sans-serif;padding:clamp(1rem,4vw,2.5rem) 1rem 5rem;
  background:radial-gradient(circle,rgba(255,255,255,.7) 2.5px,transparent 3px) 0 0/30px 30px,var(--sky)}
main{max-width:740px;margin:0 auto}
h1{font:700 clamp(2.8rem,12vw,5.2rem)/1 Comfortaa,sans-serif;margin:.2em 0 .1em;color:var(--sun);text-shadow:4px 4px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);letter-spacing:.01em}
.sub{font-weight:600;margin:0 0 1.4rem;max-width:46ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin-bottom:1rem}
.stat{border:3px solid var(--ink);border-radius:24px;padding:.6rem .5rem;text-align:center;box-shadow:4px 4px 0 var(--ink)}
.stat:nth-child(1){background:var(--grape)}.stat:nth-child(2){background:var(--sun)}.stat:nth-child(3){background:var(--mint)}
.stat b{display:block;font:700 2.2rem/1.1 Comfortaa,sans-serif}
.stat span{font-weight:800;font-size:.85rem}
.track{height:24px;border:3px solid var(--ink);border-radius:99px;background:var(--paper);margin-bottom:1.8rem;overflow:hidden}
#bar{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--coral),var(--sun),var(--mint),var(--grape));background-size:340px 100%;transition:width .6s cubic-bezier(.3,1.5,.5,1)}
form{background:var(--paper);border:3px solid var(--ink);border-radius:30px;box-shadow:6px 6px 0 var(--ink);padding:1.1rem;display:grid;gap:.65rem;margin-bottom:1.8rem}
h2{font:700 1.35rem/1 Comfortaa,sans-serif;margin:0 0 .2rem}
input,textarea{width:100%;font:inherit;font-weight:600;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:16px;padding:.6rem .9rem;outline:none}
input::placeholder,textarea::placeholder{color:#8c88b0;font-weight:400}
input:focus,textarea:focus{background:#fff8cc}
textarea{resize:vertical;min-height:2.8rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}
@media(max-width:560px){.row{grid-template-columns:1fr}}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.add{background:var(--sun);border:3px solid var(--ink);border-radius:99px;font:700 1.05rem Comfortaa,sans-serif;padding:.7rem 1.6rem;box-shadow:4px 4px 0 var(--ink);justify-self:start;transition:transform .12s,box-shadow .12s}
.add:hover{background:#ffe370}
.add:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.filters{display:flex;gap:.45rem;flex-wrap:wrap;margin-bottom:.7rem}
.pill{background:var(--paper);border:3px solid var(--ink);border-radius:99px;padding:.25rem 1rem;font-weight:800;font-size:.95rem}
.pill[aria-pressed=true]{background:var(--ink);color:#fff}
#list{display:grid;gap:1.1rem;margin-top:1.2rem}
.item{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:28px;box-shadow:5px 5px 0 var(--ink);padding:1rem 1rem 1rem .9rem;display:grid;grid-template-columns:auto 1fr auto;gap:.9rem;align-items:start}
.item:nth-child(odd){transform:rotate(-.5deg)}.item:nth-child(even){transform:rotate(.5deg)}
.item.done{background:#e3fbee}
.chk{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:#fff;display:grid;place-items:center;font-size:1.6rem;line-height:1;box-shadow:3px 3px 0 var(--ink);transition:transform .15s}
.chk:not(:disabled):hover{transform:scale(1.1) rotate(-6deg)}
.chk::after{content:"";}
.done .chk{background:var(--mint)}
.done .chk::after{content:"✓";font:700 1.7rem Comfortaa,sans-serif}
.chk:disabled{cursor:default;box-shadow:none}
.who{display:inline-block;font-weight:800;font-size:.8rem;border:2px solid var(--ink);border-radius:99px;padding:0 .65rem;margin-bottom:.25rem}
.t{font:700 1.3rem/1.25 Comfortaa,sans-serif;word-break:break-word}
.link{display:inline-block;margin-top:.45rem;font-weight:800;font-size:.9rem;color:var(--ink);background:#d9efff;border:2px solid var(--ink);border-radius:99px;padding:.05rem .8rem;text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link:hover{background:var(--sun)}
.note{margin:.5rem 0 0;background:#fff;border:2px dashed var(--ink);border-radius:14px;padding:.4rem .7rem;white-space:pre-wrap;word-break:break-word}
.by{margin-top:.7rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;font-weight:800}
.by input{max-width:220px;padding:.3rem .8rem;border-radius:99px}
.acts{display:flex;flex-direction:column;gap:.3rem}
.ico{background:#fff;border:2px solid var(--ink);border-radius:50%;width:38px;height:38px;font-size:1rem}
.ico:hover{background:var(--sun)}
.sticker{position:absolute;top:-14px;right:16px;transform:rotate(6deg);background:var(--sun);border:3px solid var(--ink);border-radius:99px;padding:.05rem .9rem;font:700 1rem Comfortaa,sans-serif;pointer-events:none}
.edit{grid-column:1/-1;display:grid;gap:.5rem}
.empty{text-align:center;font-weight:800;padding:2rem 1rem;border:3px dashed var(--ink);border-radius:28px;background:rgba(255,255,255,.6)}
.tools{margin-top:2.4rem;display:flex;gap:.6rem;flex-wrap:wrap}
.tools button{background:var(--paper);border:2px solid var(--ink);border-radius:99px;padding:.3rem 1rem;font-weight:800;font-size:.88rem}
.tools button:hover{background:var(--sun)}
#st{font-weight:800;font-size:.9rem;align-self:center}#st.err{color:#c4202e}
.view form,.view .acts,.view #exp,.view #imp{display:none}
.cf{position:fixed;width:10px;height:14px;border-radius:3px;pointer-events:none;z-index:9;animation:cf 1.1s ease-out forwards}
@keyframes cf{40%{transform:translate(calc(var(--dx)*.7),var(--dy)) rotate(calc(var(--r)*.4))}100%{transform:translate(var(--dx),calc(var(--dy) + 420px)) rotate(var(--r));opacity:0}}
:focus-visible{outline:4px solid var(--coral);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <h1>Хочу-список</h1>
  <p class="sub">Тут мы записываем, чего хотим. Когда желание сбылось, нажми на кружок!</p>

  <div class="stats">
    <div class="stat"><b id="s-all">0</b><span>Всего</span></div>
    <div class="stat"><b id="s-todo">0</b><span>Ждём</span></div>
    <div class="stat"><b id="s-done">0</b><span>Сбылось</span></div>
  </div>
  <div class="track"><div id="bar"></div></div>

  <form id="f">
    <h2>Новое желание</h2>
    <input id="title" placeholder="Чего хочется?" required maxlength="120" autocomplete="off">
    <div class="row">
      <input id="who" list="names" placeholder="Чьё желание? (имя)" maxlength="30" autocomplete="off">
      <input id="link" placeholder="Ссылка на подарок" inputmode="url" autocomplete="off">
    </div>
    <datalist id="names"></datalist>
    <textarea id="note" placeholder="Заметка: цвет, размер, где купить"></textarea>
    <button class="add" type="submit">Добавить желание</button>
  </form>

  <div class="filters" id="tabs" role="group" aria-label="Статус">
    <button class="pill" data-f="all">Все</button>
    <button class="pill" data-f="todo">Ждём</button>
    <button class="pill" data-f="done">Сбылось</button>
  </div>
  <div class="filters" id="whos" role="group" aria-label="Чьи желания"></div>

  <section id="list"></section>

  <div class="tools">
    <button id="exp">Сохранить копию</button>
    <button id="imp">Загрузить копию</button>
    <input id="file" type="file" accept="application/json" hidden>
    <button id="login">Вход для родителей</button><span id="st"></span>
  </div>
</main>

<script>
const KEY='kidslist.v1';
let items=[],filter='all',who='all',sha=null,ready=false,timer,chain=Promise.resolve();const editing=new Set();
const LOCAL=location.protocol==='file:';
let token=localStorage.getItem('wl.token')||'';
const canEdit=()=>LOCAL||!!token;
const $=s=>document.querySelector(s);
function repo(){
  let r=localStorage.getItem('wl.repo');
  if(!r&&/\.github\.io$/.test(location.hostname)){
    const o=location.hostname.split('.')[0],p=location.pathname.split('/')[1];
    r=o+'/'+(p&&p!=='index.html'?p:o+'.github.io');
  }
  return r;
}
const api=()=>`https://api.github.com/repos/${repo()}/contents/data.json`;
const hdr=()=>({Authorization:'Bearer '+token,Accept:'application/vnd.github+json'});
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const unb64=s=>decodeURIComponent(escape(atob(s.replace(/\s/g,''))));
function status(t,err){const el=$('#st');el.textContent=t;el.className=err?'err':''}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fixUrl=u=>{u=(u||'').trim();if(!u)return'';if(!/^https?:\/\//i.test(u))u='https://'+u;try{return new URL(u).href}catch(e){return''}};
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}};
const hash=s=>[...String(s)].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7);
const EMO=['🧸','🚀','🦖','🎨','⚽','🚲','🦄','🎮','🧩','🐶','🏰','🎸','🚂','🪁','🐱','🎁'];
const COL=['#ffb3b3','#ffe27a','#a8ecc8','#cdbcff','#9fd8ff','#ffc9a0'];

async function load(){
  try{
    if(LOCAL){items=JSON.parse(localStorage.getItem(KEY))||[];ready=true}
    else if(token){
      const r=await fetch(api()+'?t='+Date.now(),{headers:hdr()});
      if(r.status===404){items=[];sha=null}
      else if(r.ok){const j=await r.json();sha=j.sha;items=JSON.parse(unb64(j.content))}
      else throw new Error(r.status);
      ready=true;
    }else{
      const r=await fetch('data.json?t='+Date.now());
      items=r.ok?await r.json():[];
    }
  }catch(e){status('Не удалось загрузить данные ('+e.message+'). Проверь токен и репозиторий.',1)}
  render();
}
function save(){
  if(LOCAL){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}return}
  if(!token||!ready)return;
  status('Сохраняю…');clearTimeout(timer);
  timer=setTimeout(()=>{chain=chain.then(()=>push())},600);
}
async function push(retry){
  try{
    const body={message:'Обновление списка',content:b64(JSON.stringify(items,null,2))};
    if(sha)body.sha=sha;
    const r=await fetch(api(),{method:'PUT',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify(body)});
    if((r.status===409||r.status===422)&&!retry){
      const g=await fetch(api()+'?t='+Date.now(),{headers:hdr()});
      sha=g.ok?(await g.json()).sha:null;
      return push(true);
    }
    if(!r.ok){const m=(await r.json().catch(()=>({}))).message||'';throw new Error(r.status+' '+m)}
    sha=(await r.json()).content.sha;status('Сохранено в GitHub');
  }catch(e){status('Ошибка сохранения ('+e.message+'). Проверь токен.',1)}
}

function badge(w){return w?`<span class="who" style="background:${COL[hash(w)%COL.length]}">${esc(w)}</span><br>`:''}
function card(i){
  if(editing.has(i.id)) return `<article class="item" data-id="${i.id}"><div class="edit">
    <input class="e-t" value="${esc(i.title)}" maxlength="120" placeholder="Название">
    <input class="e-w" value="${esc(i.who)}" maxlength="30" placeholder="Чьё желание">
    <input class="e-l" value="${esc(i.link)}" placeholder="Ссылка">
    <textarea class="e-n" placeholder="Заметка">${esc(i.note)}</textarea>
    <button class="add" data-a="save">Сохранить</button></div></article>`;
  return `<article class="item ${i.done?'done':''}" data-id="${i.id}">
    <button class="chk" data-a="toggle" ${canEdit()?'':'disabled'} aria-label="${i.done?'Вернуть в ожидание':'Желание сбылось'}">${i.done?'':EMO[hash(i.id)%EMO.length]}</button>
    <div>
      ${badge(i.who)}
      <div class="t">${esc(i.title)}</div>
      ${i.link?`<a class="link" href="${esc(i.link)}" target="_blank" rel="noopener noreferrer">${esc(host(i.link))}</a>`:''}
      ${i.note?`<p class="note">${esc(i.note)}</p>`:''}
      ${i.done?(canEdit()?`<label class="by">Подарил(а): <input class="by-i" value="${esc(i.by)}" placeholder="Кто подарил" maxlength="60"></label>`:`<div class="by">Подарил(а): ${esc(i.by||'—')}</div>`):''}
    </div>
    <div class="acts">
      <button class="ico" data-a="edit" aria-label="Редактировать">✎</button>
      <button class="ico" data-a="del" aria-label="Удалить">✕</button>
    </div>
    ${i.done?'<div class="sticker">Сбылось! 🎉</div>':''}</article>`;
}

function render(){
  const done=items.filter(i=>i.done).length;
  $('#s-all').textContent=items.length;$('#s-done').textContent=done;$('#s-todo').textContent=items.length-done;
  $('#bar').style.width=items.length?done/items.length*100+'%':'0';
  const names=[...new Set(items.map(i=>i.who).filter(Boolean))];
  if(who!=='all'&&!names.includes(who))who='all';
  $('#names').innerHTML=names.map(n=>`<option value="${esc(n)}">`).join('');
  $('#whos').innerHTML=names.length>1?['all',...names].map(n=>`<button class="pill" data-w="${esc(n)}" aria-pressed="${n===who}">${n==='all'?'Все дети':esc(n)}</button>`).join(''):'';
  document.querySelectorAll('#tabs .pill').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===filter));
  const list=items.filter(i=>(filter==='all'||(filter==='done')===i.done)&&(who==='all'||i.who===who));
  $('#list').innerHTML=list.length?list.map(card).join(''):
    `<p class="empty">${items.length?'Тут пока ничего нет.':'Список пуст. Запиши первое желание!'}</p>`;
}

function confetti(x,y){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const c=['#ffd93d','#ff7a7a','#7ee0b0','#b79cff','#6ec6ff'];
  for(let k=0;k<28;k++){
    const d=document.createElement('i');d.className='cf';
    d.style.cssText=`left:${x}px;top:${y}px;background:${c[k%5]};--dx:${(Math.random()-.5)*340}px;--dy:${-90-Math.random()*220}px;--r:${Math.random()*720}deg`;
    document.body.appendChild(d);setTimeout(()=>d.remove(),1200);
  }
}

$('#f').addEventListener('submit',e=>{
  e.preventDefault();
  const title=$('#title').value.trim();if(!title)return;
  const w=$('#who').value.trim();
  items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),title,who:w,link:fixUrl($('#link').value),note:$('#note').value.trim(),done:false,by:''});
  e.target.reset();$('#who').value=w;save();render();
});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('.pill');if(b){filter=b.dataset.f;render()}});
$('#whos').addEventListener('click',e=>{const b=e.target.closest('.pill');if(b){who=b.dataset.w;render()}});
$('#list').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const el=b.closest('.item'),it=items.find(x=>x.id===el.dataset.id);if(!it)return;
  const a=b.dataset.a;
  if(a==='toggle'){
    const rc=b.getBoundingClientRect();
    it.done=!it.done;if(!it.done)it.by='';save();render();
    if(it.done){confetti(rc.x+rc.width/2,rc.y+rc.height/2);document.querySelector(`[data-id="${it.id}"] .by-i`)?.focus()}
  }
  if(a==='del'&&confirm('Удалить это желание?')){items=items.filter(x=>x!==it);save();render()}
  if(a==='edit'){editing.add(it.id);render()}
  if(a==='save'){
    it.title=el.querySelector('.e-t').value.trim()||it.title;
    it.who=el.querySelector('.e-w').value.trim();
    it.link=fixUrl(el.querySelector('.e-l').value);
    it.note=el.querySelector('.e-n').value.trim();
    editing.delete(it.id);save();render();
  }
});
$('#list').addEventListener('input',e=>{
  if(!e.target.classList.contains('by-i'))return;
  const it=items.find(x=>x.id===e.target.closest('.item').dataset.id);
  if(it){it.by=e.target.value;save()}
});
$('#exp').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(items,null,2)],{type:'application/json'}));
  a.download='wishlist.json';a.click();URL.revokeObjectURL(a.href);
};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  try{
    const d=JSON.parse(await e.target.files[0].text());
    if(Array.isArray(d)&&confirm('Заменить текущий список загруженным?')){
      items=d.filter(x=>x&&x.title).map(x=>({id:String(x.id||Math.random().toString(36).slice(2)),title:String(x.title),who:String(x.who||''),link:fixUrl(x.link),note:String(x.note||''),done:!!x.done,by:String(x.by||'')}));
      save();render();
    }
  }catch(err){alert('Не удалось прочитать файл')}
  e.target.value='';
};
$('#login').textContent=token?'Выйти':'Вход для родителей';
if(LOCAL)$('#login').hidden=true;
$('#login').onclick=()=>{
  if(token){if(confirm('Выйти из режима родителей?')){localStorage.removeItem('wl.token');location.reload()}return}
  if(!repo()){const r=prompt('Репозиторий в формате логин/название');if(!r)return;localStorage.setItem('wl.repo',r.trim())}
  const t=prompt('Вставь токен GitHub (доступ только к этому репозиторию)');
  if(t){localStorage.setItem('wl.token',t.trim());location.reload()}
};
document.body.classList.toggle('view',!canEdit());
load();
</script>
</body>
</html>
